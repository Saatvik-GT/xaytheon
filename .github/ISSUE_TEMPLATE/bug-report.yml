name: "🐛 Bug Report"
description: "File a structured bug report to help improve Xaytheon"
title: "[BUG]: <short-description>"
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: description
    attributes:
      label: "Bug Description"
      description: "A clear and concise description of what the bug is."
      placeholder: "Describe the bug..."
    validations:
      required: true
  - type: textarea
    id: reproduction-steps
    attributes:
      label: "Steps to Reproduce"
      description: "Explain how we can recreate the issue. Please provide step-by-step instructions."
      placeholder: |
        1. Open index.html
        2. Click on ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: "Expected Behavior"
      description: "What did you expect to happen?"
      placeholder: "Explain expected behavior..."
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: "Screenshots/Videos"
      description: "Drag/drop or paste images or links to videos showing the issue."
  - type: input
    id: environment-os
    attributes:
      label: "Operating System"
      placeholder: "e.g. Windows 11, macOS Sequoia, Ubuntu 24.04"
    validations:
      required: true
  - type: input
    id: environment-browser
    attributes:
      label: "Browser & Version"
      placeholder: "e.g. Chrome 125, Firefox 126"
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: "Self-Check"
      options:
        - label: "I have checked the console for errors and attached them if applicable."
          required: true
        - label: "I have verified that this issue hasn't already been reported."
          required: true
