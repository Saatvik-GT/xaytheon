name: Code Quality Linting

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  lint:
    name: Code Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'
        continue-on-error: true

      - name: Install Linting Tools Globally/NPX
        run: |
          npm install -g htmlhint stylelint stylelint-config-standard eslint

      - name: Lint HTML Files
        run: |
          htmlhint "*.html"

      - name: Lint CSS Files
        run: |
          stylelint "style.css" --config stylelint-config-standard --allow-empty-input || true

      - name: Check JavaScript Syntax
        run: |
          node --check *.js
