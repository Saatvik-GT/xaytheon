<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XAYTHEON | Neural Project Brain</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #030712;
            --surface: #111827;
            --border: rgba(255, 255, 255, 0.06);
            --accent: #8b5cf6;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: #f1f5f9;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .app-shell {
            display: grid;
            grid-template-rows: auto 1fr;
            height: 100vh;
        }

        .brain-header {
            padding: 1.5rem 3rem;
            border-bottom: 1px solid var(--border);
            background: rgba(3, 7, 18, 0.8);
            backdrop-filter: blur(12px);
            z-index: 10;
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.5rem;
        }

        h1 span {
            color: var(--accent);
        }

        .view-port {
            position: relative;
            width: 100%;
            height: 100%;
            cursor: grab;
        }

        canvas {
            display: block;
        }

        .search-overlay {
            position: absolute;
            top: 2rem;
            right: 3rem;
            background: var(--surface);
            padding: 0.75rem 1.5rem;
            border-radius: 99px;
            border: 1px solid var(--border);
            width: 300px;
            display: flex;
            align-items: center;
        }

        .search-overlay input {
            background: none;
            border: none;
            color: #fff;
            width: 100%;
            outline: none;
            margin-left: 0.5rem;
        }

        .info-panel {
            position: absolute;
            bottom: 2rem;
            left: 3rem;
            background: var(--surface);
            padding: 1.5rem;
            border-radius: 16px;
            border: 1px solid var(--border);
            width: 280px;
        }

        .info-panel h3 {
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            text-transform: uppercase;
            color: var(--accent);
        }

        .info-panel p {
            font-size: 0.8rem;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .toast {
            position: fixed;
            top: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(-100%);
            background: var(--surface);
            border: 1px solid var(--accent);
            padding: 1rem 2rem;
            border-radius: 12px;
            transition: 0.4s;
            z-index: 1000;
            text-align: center;
        }

        .toast.visible {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>

<body>
    <nav id="navbar-placeholder"></nav>

    <div class="app-shell">
        <header class="brain-header">
            <h1>Neural <span>Project</span> Brain</h1>
            <p style="font-size: 0.75rem; color: var(--text-muted);">Mapping semantic inter-service relationships and
                domain caps.</p>
        </header>

        <main class="view-port">
            <canvas id="brain-canvas"></canvas>

            <div class="search-overlay">
                🔍 <input type="text" placeholder="Quantum search for capabilities...">
            </div>

            <div class="info-panel">
                <h3>Synaptic Node</h3>
                <p id="node-desc">Target a node to reveal recursive blast radius and semantic dependencies.</p>
            </div>
        </main>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="frontend/js/brain-map.js"></script>
    <script>
        fetch('navbar.html').then(r => r.text()).then(html => {
            document.getElementById('navbar-placeholder').innerHTML = html;
        });
    </script>
</body>

</html>
