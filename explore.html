<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Explore by Topic — XAYTHEON</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="explore.css" />
  <!-- D3.js: the library that draws the interactive force-directed graph -->
  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
</head>
<body class="eightgon-page">
  <div class="content">

    <!-- Navigation Bar -->
    <nav class="navbar">
      <div class="nav-container">
        <a class="logo" href="index.html" aria-label="XAYTHEON home">
          <img class="logo-img" src="assets/logo/thelogo.png" alt="XAYTHEON logo" />
        </a>
        <ul class="nav-menu">
          <li><a class="nav-link" href="index.html">Home</a></li>
          <li><a class="nav-link" href="github.html">GitHub Dashboard</a></li>
          <li><a class="nav-link" href="community.html">Community Highlights</a></li>
          <li><a class="nav-link" href="explore.html">Explore by Topic</a></li>
          <li><a class="nav-link" href="contributions.html">Contributions</a></li>
        </ul>
        <div style="display:flex; align-items:center; gap: 10px;">
          <button id="theme-toggle" class="btn btn-primary" style="margin:0px !important; padding: 10px;"></button>
          <div class="hamburger">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
          </div>
        </div>
      </div>
    </nav>

    <!-- Explore Section -->
    <section class="github-section">
      <div class="container">
        <h2 class="section-title">Explore by Topic</h2>

        <!-- Search form -->
        <form id="explore-form" class="github-form" autocomplete="off">
          <div class="field-group group-span-4">
            <label for="ex-base-topic">Base Topic</label>
            <input id="ex-base-topic" type="text" placeholder="e.g. threejs" value="threejs" />
          </div>
          <div class="field-group group-span-4">
            <label for="ex-language">Language</label>
            <select id="ex-language">
              <option value="">Any</option>
              <option>JavaScript</option>
              <option>TypeScript</option>
              <option>Python</option>
              <option>Go</option>
              <option>Rust</option>
              <option>Java</option>
              <option>C#</option>
              <option>C++</option>
            </select>
          </div>
          <div class="field-group group-span-4">
            <label for="ex-limit">Repos to sample</label>
            <input id="ex-limit" type="number" min="10" max="100" value="50" />
          </div>
          <button class="btn btn-primary" type="submit">Explore</button>
          <button class="btn btn-outline" type="button" id="ex-clear">Clear</button>
          <div id="ex-status" class="github-status" aria-live="polite"></div>
        </form>

        <!-- Graph card -->
        <div class="card card-full-width">
          <div class="card-header"><h3>Topic Map</h3></div>
          <div class="card-body">
            <!-- The SVG inside here is where D3 draws the graph -->
            <div id="graph-wrap">
              <svg id="graph" width="100%" height="100%"></svg>
              <!-- Legend: explains what the colours mean -->
              <div id="graph-legend">
                <div><span class="legend-item legend-topic"></span>Topic (click to expand)</div>
                <div style="margin-top:4px;"><span class="legend-item legend-repo"></span>Repo (click to open)</div>
              </div>
            </div>
          </div>
        </div>

      </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <div class="container">
        <div class="footer-content">
          <div class="footer-brand">
            <span class="logo-text">XAYTHEON</span>
            <p>Empowering the next generation of innovators</p>
          </div>
        </div>
        <div class="footer-bottom">
          <p>&copy; 2025 XAYTHEON. All rights reserved.</p>
        </div>
      </div>
    </footer>

  </div>

  <script src="explore.js"></script>
  <script>
    const toggleBtn = document.getElementById('theme-toggle');

    const savedTheme = localStorage.getItem('theme') || 
        (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');

    document.documentElement.setAttribute('data-theme', savedTheme);
    updateButtonLabel(savedTheme);

    toggleBtn.addEventListener('click', () => {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
        updateButtonLabel(newTheme);
        console.log(currentTheme);
    });

    function updateButtonLabel(theme) {
        toggleBtn.innerHTML = theme === 'dark' ? '☀️' : '🌙';
    }

    const hamburger = document.querySelector('.hamburger');
    const navMenu = document.querySelector('.nav-menu');

    if (hamburger && navMenu) {
        hamburger.addEventListener('click', () => {
            hamburger.classList.toggle('active');
            navMenu.classList.toggle('active');
        });

        document.querySelectorAll('.nav-link').forEach(n => n.addEventListener('click', () => {
            hamburger.classList.remove('active');
            navMenu.classList.remove('active');
        }));
    }
    </script>
</body>
</html>
