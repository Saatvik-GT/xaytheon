<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XAYTHEON | Performance Guard</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #020617;
            --surface: #0f172a;
            --border: rgba(255, 255, 255, 0.06);
            --accent: #38bdf8;
            --red: #f43f5e;
            --green: #10b981;
            --text-muted: #64748b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 4rem;
        }

        header {
            border-bottom: 2px solid var(--border);
            padding-bottom: 2rem;
            margin-bottom: 3rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.2rem;
        }

        h1 span {
            color: var(--accent);
        }

        .layout {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 3rem;
        }

        .perf-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            transition: 0.3s;
        }

        .perf-card.critical {
            border-left: 6px solid var(--red);
            box-shadow: 0 0 20px rgba(244, 63, 94, 0.1);
        }

        .perf-card.clean {
            border-left: 6px solid var(--green);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .badge {
            font-family: 'JetBrains Mono';
            font-size: 0.7rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(0, 0, 0, 0.3);
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .stat {
            font-size: 0.85rem;
            color: var(--accent);
            font-family: 'JetBrains Mono';
        }

        .stat span {
            color: var(--text-muted);
            font-size: 0.75rem;
            display: block;
        }

        .recommendation {
            font-size: 0.85rem;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            line-height: 1.5;
            color: var(--text-muted);
        }

        .controls {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 2rem;
            position: sticky;
            top: 2rem;
        }

        label {
            display: block;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        input,
        textarea {
            width: 100%;
            background: #000;
            border: 1px solid var(--border);
            padding: 1rem;
            border-radius: 12px;
            color: #fff;
            margin-bottom: 1.5rem;
            font-family: 'JetBrains Mono';
        }

        .btn {
            background: var(--accent);
            color: #000;
            padding: 1rem;
            border: none;
            border-radius: 12px;
            font-weight: 800;
            cursor: pointer;
            width: 100%;
        }

        .toast {
            position: fixed;
            bottom: 3rem;
            right: 3rem;
            background: var(--surface);
            border: 1px solid var(--accent);
            padding: 1.5rem;
            border-radius: 16px;
            transform: translateX(180%);
            transition: 0.4s;
            z-index: 1000;
        }

        .toast.visible {
            transform: translateX(0);
        }
    </style>
</head>

<body>
    <nav id="navbar-placeholder"></nav>

    <div class="container">
        <header>
            <div>
                <h1>Performance <span>Guard</span> & Bundle City</h1>
                <p style="color: var(--text-muted); margin-top: 0.5rem;">Predictive hydration and complexity analysis
                    for main-thread optimization.</p>
            </div>
        </header>

        <div class="layout">
            <div id="perf-feed"></div>

            <aside class="controls">
                <label>Target Module</label>
                <input type="text" id="perf-file" value="frontend/js/dashboard.js">
                <label>Code Payload</label>
                <textarea id="perf-content" rows="12"
                    placeholder="Paste module code to run bundle simulation..."></textarea>
                <button class="btn" onclick="analyzeCurrent()">Run Performance Audit</button>
            </aside>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="frontend/js/bundle-city.js"></script>
    <script>
        fetch('navbar.html').then(r => r.text()).then(html => {
            document.getElementById('navbar-placeholder').innerHTML = html;
        });
    </script>
</body>

</html>
