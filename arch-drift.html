<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XAYTHEON | Semantic Arch Drift Auditor</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --surface: #121212;
            --border: rgba(255, 255, 255, 0.08);
            --accent: #0ea5e9;
            --red: #f43f5e;
            --amber: #f59e0b;
            --text-muted: #71717a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 4rem;
        }

        header {
            border-bottom: 2px solid var(--border);
            padding-bottom: 2.5rem;
            margin-bottom: 3rem;
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.5rem;
            letter-spacing: -1px;
        }

        h1 span {
            color: var(--accent);
        }

        .audit-tool {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 2.5rem;
            align-items: flex-start;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }

        .card-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
            display: block;
        }

        input,
        textarea {
            width: 100%;
            background: #000;
            border: 1px solid var(--border);
            padding: 1rem;
            border-radius: 12px;
            color: #fff;
            margin-bottom: 1.5rem;
            font-family: 'JetBrains Mono';
        }

        .btn {
            background: var(--accent);
            color: #000;
            padding: 1rem 2rem;
            border: none;
            border-radius: 12px;
            font-weight: 800;
            cursor: pointer;
            display: block;
            width: 100%;
            text-align: center;
        }

        .drift-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 1rem;
        }

        .drift-card.drift {
            border-left: 6px solid var(--red);
        }

        .drift-card.stable {
            border-left: 6px solid var(--accent);
        }

        .header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1.5rem;
        }

        .score {
            font-family: 'JetBrains Mono';
            font-weight: 700;
            color: var(--accent);
        }

        .finding-item {
            padding: 1rem;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            margin-bottom: 0.75rem;
            border: 1px solid transparent;
        }

        .finding-item.high {
            border-color: rgba(244, 63, 94, 0.2);
        }

        .finding-item.medium {
            border-color: rgba(245, 158, 11, 0.2);
        }

        .finding-item p {
            font-size: 0.8rem;
            margin-top: 0.5rem;
            color: var(--text-muted);
        }

        .toast {
            position: fixed;
            bottom: 3rem;
            right: 3rem;
            background: var(--surface);
            border: 1px solid var(--accent);
            padding: 1.5rem;
            border-radius: 16px;
            transform: translateX(180%);
            transition: 0.4s;
            z-index: 1000;
        }

        .toast.visible {
            transform: translateX(0);
        }
    </style>
</head>

<body>
    <nav id="navbar-placeholder"></nav>

    <div class="container">
        <header>
            <h1>Semantic <span>Architecture</span> Auditor</h1>
            <p style="color: var(--text-muted); margin-top: 0.75rem;">Deep structural analysis for modularity and design
                pattern compliance.</p>
        </header>

        <div class="audit-tool">
            <div class="main-panel">
                <div class="card">
                    <span class="card-title">Live Analysis Feed</span>
                    <div id="drift-reports"></div>
                </div>
            </div>

            <div class="side-panel">
                <div class="card">
                    <span class="card-title">Audit sandbox</span>
                    <input type="text" id="audit-file" value="backend/src/controllers/auth.controller.js">
                    <textarea id="audit-content" rows="10"
                        placeholder="Paste code to analyze structural drift..."></textarea>
                    <button class="btn" onclick="runAudit()">Perform Audit</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="frontend/js/arch-drift.js"></script>
    <script>
        fetch('navbar.html').then(r => r.text()).then(html => {
            document.getElementById('navbar-placeholder').innerHTML = html;
        });
    </script>
</body>

</html>
